name: backend-ci

# Garante que o que roda em produção é EXATAMENTE o que está no código:
# todo push/PR compila, testa (unit + e2e com Postgres real) e builda a imagem.
# Sem filtro de paths de propósito: o build-test é check obrigatório para dar
# merge na main, e um check só é reportado se o workflow disparar. Com o filtro
# antigo, uma PR que mexesse apenas em README ou no frontend nunca reportava o
# build-test e ficava travada em "waiting for status to be reported". O repo é
# público, então minutos de Actions não são limitados.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prontuario
          POSTGRES_PASSWORD: prontuario
          POSTGRES_DB: prontuario_e2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prontuario -d prontuario_e2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://prontuario:prontuario@localhost:5432/prontuario_e2_test
      JWT_ACCESS_SECRET: ci-access-secret-please-change
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Monorepo com npm workspaces: o lockfile é o da raiz e cobre backend e
      # frontend. Instalar de dentro de backend/ usava um package-lock.json
      # residual, anterior aos workspaces e fora de sincronia com o
      # package.json — era o que quebrava o `npm ci`.
      - name: Install (lockfile-strict)
        working-directory: .
        run: npm ci

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Guarda anti-escrita-crua em PHI (cifra em repouso)
        run: npm run check:phi

      - name: Build (type-check real)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests (isolamento multi-tenant)
        run: npm run test:e2e

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build da imagem no MESMO commit testado. Marque com o SHA para
      # rastreabilidade: a imagem em produção sempre aponta para um commit.
      - name: Docker build
        run: docker build -t pee2-api:${{ github.sha }} .
      # Em produção, faça o deploy referenciando :${{ github.sha }} (imutável),
      # nunca :latest — elimina o drift "código ≠ Docker".

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks precisa do histórico

      # Detecção de segredos vazados no código/histórico.
      - name: Gitleaks (segredos)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scan de vulnerabilidades em dependências (SCA). Report-only por ora
      # (exit-code 0) para não bloquear num backlog pré-existente; endureça para
      # '1' após zerar HIGH/CRITICAL (Dependabot ajuda). Sobe SARIF para a aba
      # Security do GitHub.
      - name: Trivy (dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          scanners: vuln,secret
          format: table
